# Run from the Actions tab (or the GitHub mobile app: Actions, Release, Run workflow).
# Tests the commit, checks the version matches package.json, then publishes the GitHub
# release vX.Y.Z and moves the major tag (v1) that `uses: bbulman/design-system-enforcer@v1` reads.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, the same as package.json (for example 1.4.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Check the version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 1.4.0, got: $VERSION"; exit 1; }
          pkg=$(node -p "require('./package.json').version")
          [ "$pkg" = "$VERSION" ] || { echo "::error::package.json says $pkg, not $VERSION"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then echo "::error::v$VERSION is already released"; exit 1; fi
      - name: Publish the release and move the major tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
          major="v${VERSION%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
